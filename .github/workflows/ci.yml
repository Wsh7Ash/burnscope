name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines declares >=20.11; test the floor and the current releases.
        node-version: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check both configurations
        run: npm run typecheck

      - name: Build the distributable output
        run: npm run build

      - name: Run the test suite
        run: npm test

      # The demo builds a deterministic incident, runs the full pipeline, and
      # asserts its own results, so a silent regression in budget maths or
      # alerting fails the build rather than shipping.
      - name: Run the demo
        run: npm run demo
